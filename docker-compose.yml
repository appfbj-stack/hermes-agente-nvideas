version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hermes-nv-backend
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: hermes-nv-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  hermes-ai:
    build:
      context: ./hermes
      dockerfile: Dockerfile
    container_name: hermes-nv-agent
    ports:
      - "3334:3334"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped
    depends_on:
      - redis

  workers:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: hermes-nv-workers
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - BACKEND_URL=http://backend:3333
      - HERMES_URL=http://hermes-ai:3334
    restart: unless-stopped
    depends_on:
      - redis

volumes:
  redis_data:
