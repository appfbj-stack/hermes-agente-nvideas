version: '3.8'

services:
  hermes-saas:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-saas:latest
    container_name: hermes-saas
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3