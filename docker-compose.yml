version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hermes-backend
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: hermes-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  hermes-ai:
    build:
      context: ./hermes
      dockerfile: Dockerfile
    container_name: hermes-agent
    ports:
      - "3334:3334"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped
    depends_on:
      - redis

  workers:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: hermes-workers
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped
    depends_on:
      - redis

  # evolution-api:
  #   image: atendai/evolution-api:latest
  #   ... (configuração da evolution api)

volumes:
  redis_data:
